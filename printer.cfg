# Klipper configuration for a 3 L piston lung simulator
# Controller: BIGTREETECH SKR Pico V1.0
# Motor port: X (on-board TMC2209, UART address 0)
#
# Runtime commands after one-time calibration:
#   SET_TRAVEL_LENGTH LENGTH=450     (optional temporary override)
#   RELEASE_PISTON
#   (manually put the piston at its physical maximum-bottom stop)
#   SET_PISTON_BOTTOM                (sets bottom=0, then parks at top)
#   BREATHE TV=500 BPM=12
#   STOP_BREATHING
#
# M112 is the emergency stop. Provide a physical, hard-wired E-stop too.
# This open-loop configuration is for test equipment, not patient ventilation.
# It has no pressure, flow, disconnect, or obstruction monitoring.

[include mainsail.cfg]


#####################################################################
# MCU and non-printer kinematics
#####################################################################

[mcu]
# SKR Pico dedicated Raspberry Pi connector: hardware UART.
# The Pico firmware must be built for "UART0 on GPIO0/GPIO1", not USB.
# /dev/serial0 is Raspberry Pi OS's model-independent primary-UART alias.
serial: /dev/serial0
restart_method: command

[printer]
# The piston is deliberately a manual_stepper, independent of XYZ kinematics.
kinematics: none
max_velocity: 1
max_accel: 1

[temperature_sensor skr_pico]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[fan]
# Fan connected to the HE output (gpio23). HE is a low-side MOSFET output but,
# unlike the dedicated fan outputs, it has no onboard flyback diode. Fit
# external inductive suppression or use a protected external MOSFET module.
pin: gpio23
kick_start_time: 0.0
shutdown_speed: 0.0

[respond]


#####################################################################
# Piston motor -- SKR Pico X motor socket
#####################################################################

[manual_stepper piston]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16

# REQUIRED: distance in mm moved by one motor revolution at the piston.
# Examples:
#   Direct 8 mm-lead screw: 8.0
#   16-tooth GT2 pulley:    32.0
# Include any gearbox using Klipper's gear_ratio option if applicable.
rotation_distance: 32.0                # 16 teeth x 2 mm GT2 pitch, direct drive
# full_steps_per_rotation: 200         # 1.8-degree motor; use 400 for 0.9-degree

# Coordinate convention: 0 mm is the manually-set maximum-bottom position.
# Positive motion goes upward. The configured mechanical top is 450 mm.
position_min: 0.0
position_max: 450.0                    # Hard mechanical travel limit
velocity: 200.0
accel: 500.0

[tmc2209 manual_stepper piston]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 1.100                     # Active driver cooling required above 0.8 A
interpolate: True
# 0 keeps spreadCycle enabled for consistent torque under piston load.
stealthchop_threshold: 0


#####################################################################
# Lung simulator state and one-time calibration
#####################################################################

[gcode_macro _LUNG_STATE]
# Permanent operational travel setting. It may be temporarily changed with:
#   SET_TRAVEL_LENGTH LENGTH=450
# This may not exceed manual_stepper.position_max above.
variable_travel_length_mm: 450.0

# Nominal 3 L / 450 mm calibration = 6.6667 mL/mm. Verify delivered volume
# experimentally and correct this value before relying on tidal volume.
variable_ml_per_mm: 6.6666667

# Runtime safety limits. Adjust only after validating the mechanism.
variable_min_tv_ml: 10.0
variable_min_bpm: 2.0
variable_max_bpm: 40.0
variable_park_speed_mm_s: 25.0

# A small nominal dwell at each end of the stroke. Motion time is compensated
# so the requested BPM remains correct (1:1 inspiration-to-expiration ratio).
variable_endpoint_dwell_s: 0.010

# Internal state -- reset on every Klipper RESTART/FIRMWARE_RESTART.
variable_running: 0
variable_homed: 0
variable_at_top: 0
variable_phase: 0
variable_tv_ml: 0.0
variable_bpm: 0.0
variable_stroke_mm: 0.0
variable_move_time_s: 0.0
variable_speed_mm_s: 0.0
gcode:
  G4 P0


#####################################################################
# Manual homing
#####################################################################

[gcode_macro SET_TRAVEL_LENGTH]
description: Set operational bottom-to-top travel; usage SET_TRAVEL_LENGTH LENGTH=<mm>
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% set length = params.LENGTH|default(-1)|float %}
  {% set hard_max = printer.configfile.settings["manual_stepper piston"].position_max|float %}
  {% if state.running|int == 1 %}
    { action_raise_error("Run STOP_BREATHING before changing travel") }
  {% elif length <= 0 or length > hard_max %}
    { action_raise_error("LENGTH must be above 0 and no greater than the %.3f mm hard limit" % hard_max) }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=travel_length_mm VALUE={length}
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=0
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=0
  RESPOND TYPE=command MSG="Operational travel set to {"%.3f" % length} mm until the next Klipper restart; run PARK_PISTON_TOP after homing"

[gcode_macro RELEASE_PISTON]
description: Disable the piston motor so it can be placed at bottom by hand
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% if state.running|int == 1 %}
    { action_raise_error("Run STOP_BREATHING before releasing the piston") }
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_LUNG_LOOP DURATION=0
  MANUAL_STEPPER STEPPER=piston ENABLE=0
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=homed VALUE=0
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=0
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=0
  RESPOND TYPE=command MSG="Motor released. Move the piston by hand to its physical bottom, then run SET_PISTON_BOTTOM"

[gcode_macro SET_PISTON_BOTTOM]
description: Set manual bottom zero and normally park at operational top
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% set hard_max = printer.configfile.settings["manual_stepper piston"].position_max|float %}
  {% set max_speed = printer.configfile.settings["manual_stepper piston"].velocity|float %}
  {% set accel = printer.configfile.settings["manual_stepper piston"].accel|float %}
  {% set travel = params.TRAVEL|default(state.travel_length_mm)|float %}
  {% set speed = params.SPEED|default(state.park_speed_mm_s)|float %}
  {% set park = params.PARK|default(1)|int %}
  {% if state.running|int == 1 %}
    { action_raise_error("Run STOP_BREATHING before setting piston bottom") }
  {% elif travel <= 0 or travel > hard_max %}
    { action_raise_error("TRAVEL must be above 0 and no greater than the %.3f mm hard limit" % hard_max) }
  {% elif speed <= 0 or speed > max_speed %}
    { action_raise_error("SPEED must be above 0 and no greater than %.3f mm/s" % max_speed) }
  {% elif park not in [0, 1] %}
    { action_raise_error("PARK must be 0 or 1") }
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_LUNG_LOOP DURATION=0
  MANUAL_STEPPER STEPPER=piston ENABLE=1 SET_POSITION=0
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=travel_length_mm VALUE={travel}
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=homed VALUE=1
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=0
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=0
  {% if park == 1 %}
    # From manual bottom zero, positive travel must move toward physical top.
    MANUAL_STEPPER STEPPER=piston MOVE={travel} SPEED={speed} ACCEL={accel}
    SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=1
    RESPOND TYPE=command MSG="Bottom set to 0.000 mm; piston parked at top {"%.3f" % travel} mm"
  {% else %}
    RESPOND TYPE=command MSG="Bottom set to 0.000 mm; PARK=0 so piston remains at bottom"
  {% endif %}

[gcode_macro PARK_PISTON_TOP]
description: Move a homed, idle piston to the configured operational top
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% set max_speed = printer.configfile.settings["manual_stepper piston"].velocity|float %}
  {% set accel = printer.configfile.settings["manual_stepper piston"].accel|float %}
  {% set speed = params.SPEED|default(state.park_speed_mm_s)|float %}
  {% if state.homed|int != 1 %}
    { action_raise_error("Piston is not homed. Use RELEASE_PISTON, position it manually, then SET_PISTON_BOTTOM") }
  {% elif state.running|int == 1 %}
    { action_raise_error("Run STOP_BREATHING first") }
  {% elif speed <= 0 or speed > max_speed %}
    { action_raise_error("SPEED must be above 0 and no greater than %.3f mm/s" % max_speed) }
  {% endif %}
  MANUAL_STEPPER STEPPER=piston ENABLE=1
  MANUAL_STEPPER STEPPER=piston MOVE={state.travel_length_mm|float} SPEED={speed} ACCEL={accel}
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=1
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=0
  RESPOND TYPE=command MSG="Piston parked at operational top {"%.3f" % (state.travel_length_mm|float)} mm"

[gcode_macro RETURN_TO_BOTTOM]
description: Move a homed, idle piston back to its zero position
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% set max_speed = printer.configfile.settings["manual_stepper piston"].velocity|float %}
  {% set accel = printer.configfile.settings["manual_stepper piston"].accel|float %}
  {% set speed = params.SPEED|default(5.0)|float %}
  {% if state.homed|int != 1 %}
    { action_raise_error("Piston is not homed. Use RELEASE_PISTON, position it manually, then SET_PISTON_BOTTOM") }
  {% elif state.running|int == 1 %}
    { action_raise_error("Run STOP_BREATHING instead") }
  {% elif speed <= 0 or speed > max_speed %}
    { action_raise_error("SPEED must be above 0 and no greater than %.3f mm/s" % max_speed) }
  {% endif %}
  MANUAL_STEPPER STEPPER=piston ENABLE=1
  MANUAL_STEPPER STEPPER=piston MOVE=0 SPEED={speed} ACCEL={accel}
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=0
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=0
  RESPOND TYPE=command MSG="Piston returned to bottom"


#####################################################################
# Continuous breathing control
#####################################################################

[gcode_macro BREATHE]
description: Start continuous 1:1 breathing; usage BREATHE TV=<mL> BPM=<breaths/min>
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% set tv = params.TV|default(-1)|float %}
  {% set bpm = params.BPM|default(-1)|float %}
  {% set ml_per_mm = state.ml_per_mm|float %}
  {% set travel = state.travel_length_mm|float %}
  {% set piston_cfg = printer.configfile.settings["manual_stepper piston"] %}
  {% set hard_max = piston_cfg.position_max|float %}
  {% set max_speed = piston_cfg.velocity|float %}
  {% set accel = piston_cfg.accel|float %}
  {% set dwell = state.endpoint_dwell_s|float %}

  {% if state.running|int == 1 %}
    { action_raise_error("Breathing is already running; use STOP_BREATHING before changing settings") }
  {% elif state.homed|int != 1 %}
    { action_raise_error("Piston is not homed. Use RELEASE_PISTON, position it manually, then SET_PISTON_BOTTOM") }
  {% elif state.at_top|int != 1 %}
    { action_raise_error("Piston is not at operational top. Run PARK_PISTON_TOP first") }
  {% elif travel <= 0 or travel > hard_max %}
    { action_raise_error("Configured travel is outside the manual_stepper hard limits") }
  {% elif ml_per_mm <= 0 %}
    { action_raise_error("Set variable_ml_per_mm in _LUNG_STATE and RESTART before breathing") }
  {% elif tv < state.min_tv_ml|float %}
    { action_raise_error("TV must be at least %.1f mL" % (state.min_tv_ml|float)) }
  {% elif tv > travel * ml_per_mm %}
    { action_raise_error("TV %.1f mL exceeds calibrated capacity %.1f mL" % (tv, travel * ml_per_mm)) }
  {% elif bpm < state.min_bpm|float or bpm > state.max_bpm|float %}
    { action_raise_error("BPM must be between %.1f and %.1f" % (state.min_bpm|float, state.max_bpm|float)) }
  {% elif accel <= 0 %}
    { action_raise_error("accel in [manual_stepper piston] must be greater than zero") }
  {% elif dwell < 0 %}
    { action_raise_error("variable_endpoint_dwell_s cannot be negative") }
  {% else %}
    {% set stroke = tv / ml_per_mm %}
    {% set move_time = 30.0 / bpm - dwell %}
    {% set discriminant = move_time * move_time - 4.0 * stroke / accel %}
    {% if move_time <= 0 or discriminant <= 0 %}
      { action_raise_error("Requested TV/BPM is too fast for the configured acceleration") }
    {% else %}
      # This speed solves: move_time = stroke/speed + speed/accel.
      # The smaller quadratic root guarantees a trapezoidal move profile.
      {% set speed = 2.0 * stroke / (move_time + discriminant ** 0.5) %}
      {% if speed > max_speed %}
        { action_raise_error("Requested TV/BPM needs %.3f mm/s, above the %.3f mm/s limit" % (speed, max_speed)) }
      {% else %}
        SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=tv_ml VALUE={tv}
        SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=bpm VALUE={bpm}
        SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=stroke_mm VALUE={stroke}
        SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=move_time_s VALUE={move_time}
        SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=speed_mm_s VALUE={speed}
        SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=0
        SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=running VALUE=1
        MANUAL_STEPPER STEPPER=piston ENABLE=1
        RESPOND TYPE=command MSG="Breathing started: TV={"%.1f" % tv} mL, BPM={"%.2f" % bpm}, stroke={"%.3f" % stroke} mm, speed={"%.3f" % speed} mm/s"
        _LUNG_STEP
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _LUNG_STEP]
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% set top = state.travel_length_mm|float %}
  {% set accel = printer.configfile.settings["manual_stepper piston"].accel|float %}
  {% if state.running|int == 1 %}
    {% if state.phase|int == 0 %}
      # Inspiration: begin at top and move downward by the tidal stroke.
      MANUAL_STEPPER STEPPER=piston MOVE={top - state.stroke_mm|float} SPEED={state.speed_mm_s|float} ACCEL={accel} SYNC=0
      SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=1
      SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=0
    {% else %}
      # Expiration/reset: return to the same maximum-top position.
      MANUAL_STEPPER STEPPER=piston MOVE={top} SPEED={state.speed_mm_s|float} ACCEL={accel} SYNC=0
      SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=0
      SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=1
    {% endif %}
    # The next half-stroke cannot start before this complete half-period.
    UPDATE_DELAYED_GCODE ID=_LUNG_LOOP DURATION={state.move_time_s|float + state.endpoint_dwell_s|float}
  {% endif %}

[delayed_gcode _LUNG_LOOP]
gcode:
  _LUNG_STEP

[gcode_macro STOP_BREATHING]
description: Gracefully stop after the active half-stroke and return to top
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% set accel = printer.configfile.settings["manual_stepper piston"].accel|float %}
  {% set return_top = params.RETURN|default(1)|int %}
  {% set disable = params.DISABLE|default(0)|int %}
  UPDATE_DELAYED_GCODE ID=_LUNG_LOOP DURATION=0
  SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=running VALUE=0
  {% if state.running|int == 1 %}
    # Finish the already-queued half-stroke before returning or releasing.
    MANUAL_STEPPER STEPPER=piston SYNC=1
  {% endif %}
  {% if return_top == 1 and state.running|int == 1 and state.homed|int == 1 and state.at_top|int != 1 %}
    MANUAL_STEPPER STEPPER=piston MOVE={state.travel_length_mm|float} SPEED={state.speed_mm_s|float} ACCEL={accel}
    SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=1
    SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=phase VALUE=0
  {% endif %}
  {% if disable == 1 %}
    MANUAL_STEPPER STEPPER=piston ENABLE=0
    SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=homed VALUE=0
    SET_GCODE_VARIABLE MACRO=_LUNG_STATE VARIABLE=at_top VALUE=0
  {% endif %}
  {% if disable == 1 %}
    RESPOND TYPE=command MSG="Breathing stopped; piston released and home invalidated"
  {% elif return_top == 1 %}
    RESPOND TYPE=command MSG="Breathing stopped; piston held at top"
  {% else %}
    RESPOND TYPE=command MSG="Breathing stopped"
  {% endif %}

[gcode_macro LUNG_STATUS]
description: Report manual-home state and current breathing settings
gcode:
  {% set state = printer["gcode_macro _LUNG_STATE"] %}
  {% set travel = state.travel_length_mm|float %}
  {% set capacity = travel * state.ml_per_mm|float %}
  { action_respond_info("running=%d, homed=%d, at_top=%d, travel=%.1f mm, TV=%.1f mL, BPM=%.2f, calibrated_capacity=%.1f mL" % (state.running|int, state.homed|int, state.at_top|int, travel, state.tv_ml|float, state.bpm|float, capacity)) }
